<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>具身智读</title>
    <link rel="icon" href="/logo.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=5" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/logo.svg?v=2" width="44" height="44" alt="" />
          <div>
            <p class="eyebrow">Robotics / Embodied AI Reading Desk</p>
            <h1>具身智读</h1>
          </div>
        </div>
        <div class="status-row">
          <span id="qwenStatus" class="status status-muted">检查 Qwen</span>
          <span id="modeValue" class="mode-badge">摘要模式</span>
        </div>
      </header>

      <section class="command-bar" aria-label="检索和刷新">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索标题、作者、方法、摘要" autocomplete="off" />
        </label>

        <div class="segmented" role="group" aria-label="时间范围">
          <button class="segment" type="button" data-days="1">1 天</button>
          <button class="segment" type="button" data-days="3">3 天</button>
          <button class="segment active" type="button" data-days="7">7 天</button>
        </div>

        <label class="toggle">
          <input id="qwenToggle" type="checkbox" checked />
          <span>Qwen</span>
        </label>

        <button id="refreshButton" class="primary-button" type="button" title="刷新论文">
          <span aria-hidden="true">↻</span>
          刷新
        </button>
      </section>

      <section id="loadStatus" class="load-status is-idle" aria-live="polite" aria-label="加载状态">
        <div class="load-status-copy">
          <span class="load-dot" aria-hidden="true"></span>
          <span id="loadStatusText">Qwen 就绪</span>
        </div>
        <div class="load-progress-track" aria-hidden="true">
          <div id="loadProgress" class="load-progress-bar"></div>
        </div>
      </section>

      <section class="brief-band">
        <div class="brief-copy">
          <p id="briefScope" class="section-label">近 7 天总览</p>
          <p id="dailyBrief" class="brief-text">正在载入论文列表...</p>
          <div id="themeList" class="theme-list" aria-label="主题"></div>
        </div>
        <div class="brief-stats" aria-label="统计">
          <div>
            <span class="meta-label">已加载</span>
            <strong id="countValue">-</strong>
          </div>
          <div>
            <span class="meta-label">当前显示</span>
            <strong id="visibleValue">-</strong>
          </div>
          <div>
            <span class="meta-label">收藏</span>
            <strong id="favoriteValue">-</strong>
          </div>
          <div>
            <span class="meta-label">核心关注</span>
            <strong id="highValue">-</strong>
          </div>
        </div>
      </section>

      <section class="digest-panel" aria-label="速览日报">
        <div class="digest-head">
          <div>
            <p class="section-label">速览日报</p>
            <h2 id="digestTitle">近 7 天阅读简报</h2>
          </div>
          <div class="digest-actions">
            <span id="digestDate" class="mode-badge">生成中</span>
            <button id="copyDigestButton" class="ghost-button" type="button">复制日报</button>
          </div>
        </div>
        <div class="digest-grid">
          <article class="digest-lead">
            <span class="digest-label">一句话结论</span>
            <p id="digestLead">等待论文数据...</p>
          </article>
          <article>
            <span class="digest-label">必读论文</span>
            <ol id="digestMustRead" class="digest-list"></ol>
          </article>
          <article>
            <span class="digest-label">方向信号</span>
            <ul id="digestSignals" class="digest-list"></ul>
          </article>
          <article>
            <span class="digest-label">阅读队列</span>
            <ul id="digestQueue" class="digest-list"></ul>
          </article>
        </div>
        <p id="copyDigestStatus" class="copy-status" aria-live="polite"></p>
      </section>

      <section class="filter-panel" aria-label="论文筛选">
        <div class="filter-chips" role="group" aria-label="视图">
          <button class="filter-chip active" type="button" data-view="all">全部</button>
          <button class="filter-chip" type="button" data-view="core">核心关注</button>
          <button class="filter-chip" type="button" data-view="favorites">收藏</button>
          <button class="filter-chip" type="button" data-view="high">高优先级</button>
          <button class="filter-chip" type="button" data-view="unread">未读</button>
          <button class="filter-chip" type="button" data-view="reading">在读</button>
          <button class="filter-chip" type="button" data-view="done">已读</button>
          <button class="filter-chip" type="button" data-view="notes">有笔记</button>
        </div>

        <div class="filter-tools">
          <label class="select-field">
            <span>分类</span>
            <select id="categoryFilter"></select>
          </label>
          <label class="select-field">
            <span>排序</span>
            <select id="sortSelect">
              <option value="industry">产业相关度</option>
              <option value="priority">优先级</option>
              <option value="date">最新发布</option>
              <option value="favorite">收藏优先</option>
              <option value="category">分类</option>
            </select>
          </label>
          <button id="clearFiltersButton" class="ghost-button" type="button">清空筛选</button>
        </div>
      </section>

      <section class="meta-grid" aria-label="运行状态">
        <div>
          <span class="meta-label">来源</span>
          <strong id="sourceValue">arXiv</strong>
        </div>
        <div>
          <span class="meta-label">生成时间</span>
          <strong id="timeValue">-</strong>
        </div>
        <div>
          <span class="meta-label">本地库</span>
          <strong id="libraryValue">-</strong>
        </div>
      </section>

      <section class="paper-section">
        <div class="section-head">
          <p class="section-label">论文工作台</p>
          <span id="resultHint" class="mode-badge">等待数据</span>
        </div>
        <div id="paperList" class="paper-list"></div>
        <div id="feedSentinel" class="feed-sentinel" aria-live="polite">
          <span class="feed-dot" aria-hidden="true"></span>
          <span id="feedStatus">下滑继续加载</span>
        </div>
      </section>
    </main>

    <template id="paperTemplate">
      <article class="paper-card">
        <div class="paper-head">
          <div class="paper-title-block">
            <div class="paper-kicker">
              <span class="industry-level"></span>
              <span class="priority"></span>
              <span class="category"></span>
              <span class="user-category-chip"></span>
              <span class="date"></span>
            </div>
            <h2 class="title"></h2>
            <p class="authors"></p>
          </div>
          <button class="icon-button favorite-button" type="button" title="收藏" aria-label="收藏">☆</button>
        </div>

        <p class="one-line"></p>

        <div class="paper-body">
          <div class="paper-main">
            <div class="paper-insights">
              <section class="insight-card">
                <span>为什么值得看</span>
                <p class="why"></p>
              </section>
              <section class="insight-card">
                <span>待读点</span>
                <p class="limits"></p>
              </section>
            </div>
            <div class="chip-block">
              <span class="chip-label">方法</span>
              <div class="method-list"></div>
            </div>
            <div class="chip-block">
              <span class="chip-label">产业信号</span>
              <div class="signal-list"></div>
            </div>
          </div>

          <aside class="paper-side">
            <div class="paper-side-summary">
              <span>产业分</span>
              <strong class="industry-score">-</strong>
            </div>
            <label class="select-field stack-field">
              <span>分类</span>
              <select class="category-select"></select>
            </label>
            <div class="status-editor" role="group" aria-label="阅读状态">
              <button type="button" data-status="unread">未读</button>
              <button type="button" data-status="reading">在读</button>
              <button type="button" data-status="done">已读</button>
              <button type="button" data-status="skip">跳过</button>
            </div>
            <div class="paper-actions">
              <a class="link abs-link" target="_blank" rel="noreferrer">arXiv</a>
              <a class="link pdf-link" target="_blank" rel="noreferrer">PDF</a>
            </div>
          </aside>
        </div>

        <details class="note-box">
          <summary>笔记</summary>
          <textarea class="notes" rows="3" placeholder="记录待读点、复现计划、相关项目..."></textarea>
          <div class="note-footer">
            <span class="save-status">本地保存</span>
          </div>
        </details>
      </article>
    </template>

    <script src="/app.js?v=7" defer></script>
  </body>
</html>
